services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DevOpsInventoryManagement
    ports:
      - "6432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: DevOpsInventoryManagement.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Username=postgres;Password=postgres;Database=DevOpsInventoryManagement
    ports:
      - "8090:80"
    depends_on:
      - db

volumes:
  db_data:
